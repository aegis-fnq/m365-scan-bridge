name: release-please

# Opens and updates a release pull request from the Conventional Commit titles merged to main;
# merging it tags the version and publishes a GitHub release.
#
# The token: the organisation's pipeline App when its secrets are shared with this repository,
# so the release pull request triggers CI; otherwise the workflow's own token, whose pull
# requests do not trigger CI (re-run the checks by hand, or push to the release branch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.PIPELINE_APP_ID }}
    steps:
      - id: app-token
        if: ${{ env.APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
